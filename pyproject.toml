[project]
name = "llm-peft-recipes"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "bitsandbytes>=0.45,<1.0",
    "datasets>=3.0,<4.0",
    "ipykernel>=6.29,<7.0",
    "ipywidgets>=8.1.8",
    "lm-eval>=0.4,<1.0",
    "matplotlib>=3.9,<4.0",
    "notebook>=7.0,<8.0",
    "peft>=0.13,<1.0",
    "protobuf>=6.33.4",
    "python-dotenv>=1.0,<2.0",
    "sentencepiece>=0.2,<1.0",
    "torch>=2.5,<3.0",
    "tqdm>=4.66,<5.0",
    "transformers>=4.46,<5.0",
    "trl>=0.12,<1.0",
]

[tool.uv.extra-build-dependencies]
# flash-attn requires torch during build
flash-attn = ["torch>=2.5,<3.0", "packaging", "ninja", "numpy"]

[project.optional-dependencies]
# flash-attn requires CUDA and only works on Linux with NVIDIA GPUs
# On CUDA-enabled systems, install with: uv sync --extra cuda
cuda = [
    "flash-attn>=2.7,<3.0",
]
